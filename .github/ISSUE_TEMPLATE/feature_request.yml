name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome. Note that the project has a narrow scope on purpose; see the "What will be declined" section of CONTRIBUTING.md before proposing a regular expression.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketch the API if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched the existing issues and pull requests.
          required: true
        - label: I am willing to open a pull request for this.
